name: Apply fast admin access controls
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fast-admin-access.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        shell: bash
        run: |
          if ! grep -q 'ATPL FAST ACCESS V7' shared-auth.js; then
            printf '\n' >> shared-auth.js
            cat fast-admin-v7.js >> shared-auth.js
          fi
          python - <<'PY'
          from pathlib import Path
          p = Path('hr-workplace.js')
          s = p.read_text(encoding='utf-8')
          s = s.replace('shared-auth.js?v=20260910a','shared-auth.js?v=20260910c')
          s = s.replace('shared-auth.js?v=20260910b','shared-auth.js?v=20260910c')
          p.write_text(s, encoding='utf-8')
          PY
          node --check shared-auth.js
          node --check hr-workplace.js
      - name: Commit and clean temporary files
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-fast-admin-access.yml fast-admin-v7.js
          git add shared-auth.js hr-workplace.js
          git commit -m 'Make User Access instant and add admin login settings'
          git push
