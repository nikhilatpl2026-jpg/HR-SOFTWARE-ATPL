name: Patch ERP Login

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-login.yml'

permissions:
  contents: write

jobs:
  patch-login:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch login section
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('hr-workplace.js')
          text = p.read_text(encoding='utf-8')
          marker = '/* Multiple Login + feature-wise access control.'
          if marker not in text:
              raise SystemExit('Login marker not found')
          prefix = text.split(marker,1)[0].rstrip() + '\n\n'
          new = r'''/* Multiple Login + feature-wise access control — V2 landing + strict permissions. */
          (function(){'use strict';
          var K='ATPL_UserAccess_V1',S='ATPL_UserSession_V1',editId=null,BOOT=false;
          function e(v){return String(v==null?'':v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
          function load(){try{var a=JSON.parse(localStorage.getItem(K)||'[]');return Array.isArray(a)?a:[]}catch(_){return[]}}
          function save(a){localStorage.setItem(K,JSON.stringify(a))}
          function session(){try{return JSON.parse(sessionStorage.getItem(S)||'null')}catch(_){return null}}
          function setSession(u){sessionStorage.setItem(S,JSON.stringify({id:u.id,name:u.name||u.id,admin:!!u.admin,access:Array.isArray(u.access)?u.access:[]}))}
          function has(u,p){return !!u&&(u.admin||(Array.isArray(u.access)&&u.access.indexOf(p)>=0))}
          function features(){return Array.prototype.map.call(document.querySelectorAll('.vitem[id^="vn-"]'),function(x){return{id:x.id.slice(3),name:(x.textContent||'').replace(/\s+/g,' ').trim().replace(/\d+$/,'').trim(),el:x}}).filter(function(x){return x.id!=='useraccess'})}
          function firstAllowed(u){var fs=features().filter(function(f){return has(u,f.id)});return fs.length?fs[0].id:null}
          function hideUnauthorizedPages(u){Array.prototype.forEach.call(document.querySelectorAll('[id^="page-"]'),function(pg){var id=pg.id.slice(5);if(!has(u,id)){pg.classList.remove('active');if(pg.style)pg.style.display='none'}})}
          function applyAccess(){var u=session(),ua=document.getElementById('vn-useraccess'),logout=document.getElementById('uaLogoutBtn'),who=document.getElementById('uaWho');features().forEach(function(f){f.el.style.display=has(u,f.id)?'':'none'});if(ua)ua.style.display=u&&u.admin?'':'none';if(logout)logout.style.display=u?'inline-flex':'none';if(who){who.style.display=u?'inline-flex':'none';who.textContent=u?'👤 '+(u.name||u.id):''}hideUnauthorizedPages(u);Array.prototype.forEach.call(document.querySelectorAll('.vnav-sub'),function(g){var visible=Array.prototype.some.call(g.querySelectorAll('.vitem'),function(x){return x.style.display!=='none'});g.style.display=visible?'':'none'})}
          function showLogin(msg){var l=document.getElementById('uaLogin');if(!l)return;var er=document.getElementById('uaLoginErr');if(er)er.textContent=msg||'';l.style.display='flex';document.body.style.overflow='hidden';setTimeout(function(){var x=document.getElementById('uaLoginId');if(x)x.focus()},30)}
          function hideLogin(){var l=document.getElementById('uaLogin');if(l)l.style.display='none';document.body.style.overflow=''}
          function css(){if(document.getElementById('uaCss2'))return;var s=document.createElement('style');s.id='uaCss2';s.textContent='\
          #uaLogin{position:fixed;inset:0;z-index:300000;display:none;align-items:center;justify-content:center;padding:24px;background:radial-gradient(circle at 15% 20%,rgba(79,70,229,.34),transparent 34%),radial-gradient(circle at 85% 80%,rgba(14,165,233,.26),transparent 32%),linear-gradient(135deg,#050816 0%,#111936 45%,#16122f 100%);font-family:Inter,Arial,sans-serif;overflow:auto}\
          .uaLanding{width:min(1040px,96vw);min-height:600px;display:grid;grid-template-columns:1.12fr .88fr;border:1px solid rgba(255,255,255,.13);border-radius:28px;overflow:hidden;background:rgba(15,23,42,.72);backdrop-filter:blur(18px);box-shadow:0 35px 100px rgba(0,0,0,.5)}\
          .uaHero{position:relative;padding:64px 58px;color:#fff;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.uaHero:before{content:"";position:absolute;width:330px;height:330px;border-radius:50%;background:linear-gradient(135deg,#6366f1,#06b6d4);filter:blur(1px);opacity:.12;right:-90px;top:-70px}.uaPill{display:inline-flex;align-items:center;gap:8px;width:max-content;padding:7px 12px;border:1px solid rgba(165,180,252,.32);border-radius:999px;background:rgba(99,102,241,.12);font-size:11px;font-weight:800;letter-spacing:.8px;color:#c7d2fe}.uaHero h1{font-size:48px;line-height:1.03;margin:18px 0 14px;letter-spacing:-2px}.uaHero h1 span{background:linear-gradient(90deg,#a5b4fc,#67e8f9);-webkit-background-clip:text;color:transparent}.uaHero p{max-width:480px;color:#a8b1c7;font-size:14px;line-height:1.75}.uaDots{display:flex;gap:8px;margin-top:28px}.uaDots i{width:9px;height:9px;border-radius:50%;background:#4f46e5;box-shadow:0 0 20px rgba(99,102,241,.7)}.uaDots i:nth-child(2){background:#06b6d4}.uaDots i:nth-child(3){background:#22c55e}.uaLoginSide{display:flex;align-items:center;justify-content:center;padding:42px;background:rgba(255,255,255,.035);border-left:1px solid rgba(255,255,255,.09)}\
          .uaCard{width:100%;max-width:390px;background:#fff;border-radius:20px;padding:28px;box-shadow:0 24px 70px rgba(0,0,0,.35)}.uaBrand{display:flex;align-items:center;gap:11px;margin-bottom:22px}.uaLogo{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;color:#fff;font-weight:900;background:linear-gradient(135deg,#4f46e5,#0ea5e9);box-shadow:0 10px 30px rgba(79,70,229,.3)}.uaBrand b{display:block;font-size:15px;color:#0f172a}.uaBrand span{font-size:9px;color:#64748b;letter-spacing:1px}.uaCard h2{font-size:22px;color:#0f172a;margin:0 0 5px}.uaSub{font-size:11px;color:#64748b;margin-bottom:20px}.uaField{margin-bottom:13px}.uaField label{display:block;font-size:9px;font-weight:900;letter-spacing:.8px;color:#475569;margin-bottom:6px}.uaField input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid #cbd5e1;border-radius:9px;background:#f8fafc;color:#0f172a;font-size:13px;outline:none}.uaField input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}.uaLoginBtn{width:100%;border:0;border-radius:10px;padding:11px 14px;background:linear-gradient(90deg,#4f46e5,#2563eb);color:#fff;font-weight:900;cursor:pointer;box-shadow:0 10px 25px rgba(79,70,229,.24)}.uaErr{font-size:11px;color:#dc2626;margin-top:10px;min-height:16px}.uaHint{font-size:9px;color:#94a3b8;text-align:center;margin-top:13px}\
          .uaBtn{border:0;border-radius:8px;padding:9px 14px;font-weight:800;cursor:pointer;background:#4f46e5;color:#fff}.uaBtn.gray{background:#e2e8f0;color:#0f172a}.uaBtn.red{background:#dc2626}#uaPage{position:fixed;inset:52px 0 0 0;z-index:120000;background:#f1f5f9;display:none;overflow:auto;padding:22px}.uaWrap{max-width:1100px;margin:auto}.uaTop{display:flex;align-items:center;gap:12px;margin-bottom:16px}.uaTop h2{font-size:20px}.uaTop button{margin-left:auto}.uaGrid{display:grid;grid-template-columns:380px 1fr;gap:16px}.uaPanel{background:#fff;border:1px solid #e2e8f0;border-radius:14px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.05)}.uaChecks{display:grid;grid-template-columns:1fr 1fr;gap:7px;max-height:330px;overflow:auto;padding:8px;border:1px solid #e2e8f0;border-radius:9px}.uaCheck{display:flex;align-items:center;gap:7px;font-size:11px;padding:6px;background:#f8fafc;border-radius:7px}.uaUser{display:flex;align-items:center;gap:10px;padding:11px;border-bottom:1px solid #e2e8f0}.uaUserInfo{flex:1}.uaUserInfo b{display:block;font-size:12px}.uaUserInfo span{font-size:10px;color:#64748b}.uaActions{display:flex;gap:6px}.uaMini{border:0;border-radius:6px;padding:6px 9px;cursor:pointer;font-size:10px;font-weight:700}.uaEdit{background:#dbeafe;color:#1d4ed8}.uaDel{background:#fee2e2;color:#b91c1c}#uaWho,#uaLogoutBtn{align-items:center;gap:4px;font-size:10px}@media(max-width:800px){.uaLanding{grid-template-columns:1fr;min-height:0}.uaHero{padding:35px 28px}.uaHero h1{font-size:35px}.uaLoginSide{border-left:0;border-top:1px solid rgba(255,255,255,.09);padding:28px}.uaGrid{grid-template-columns:1fr}.uaChecks{grid-template-columns:1fr}}';document.head.appendChild(s)}
          function bootstrap(){var a=load();if(a.length)return;a=[{id:'admin',name:'Owner / Admin',pass:'admin123',admin:true,access:['*']}];save(a);BOOT=true}
          function inject(){if(document.getElementById('vn-useraccess'))return;var host=document.getElementById('cat-emp')||document.querySelector('.vnav-sub');if(host){var n=document.createElement('div');n.className='vitem';n.id='vn-useraccess';n.innerHTML='<span class="vi">👥</span>User Access';n.onclick=openPage;host.appendChild(n)}var hr=document.querySelector('.header-right');if(hr){var who=document.createElement('span');who.id='uaWho';who.style.cssText='display:none;padding:5px 9px;border-radius:8px;background:rgba(255,255,255,.12);color:#fff';hr.appendChild(who);var lo=document.createElement('button');lo.id='uaLogoutBtn';lo.textContent='Logout';lo.style.cssText='display:none;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.12);color:#fff;padding:6px 10px;border-radius:8px;cursor:pointer';lo.onclick=logout;hr.appendChild(lo)}var p=document.createElement('div');p.id='uaPage';p.innerHTML='<div class="uaWrap"><div class="uaTop"><div><h2>👥 User Access Management</h2><div style="font-size:11px;color:#64748b;margin-top:3px">User ID, password aur exact feature-wise access control</div></div><button class="uaBtn gray" id="uaClose">✕ Close</button></div><div class="uaGrid"><div class="uaPanel"><h3 style="font-size:14px;margin-bottom:14px" id="uaFormTitle">Create User</h3><div class="uaField"><label>USER NAME</label><input id="uaName" placeholder="Example: Ram"></div><div class="uaField"><label>USER ID</label><input id="uaId" autocomplete="off" placeholder="Example: ram01"></div><div class="uaField"><label>PASSWORD</label><input id="uaPass" type="password" autocomplete="new-password" placeholder="Password"></div><div style="display:flex;align-items:center;justify-content:space-between;margin:12px 0 7px"><b style="font-size:11px">Feature Access</b><button type="button" class="uaMini uaEdit" id="uaAll">Select All</button></div><div class="uaChecks" id="uaChecks"></div><div style="display:flex;gap:8px;margin-top:14px"><button class="uaBtn" id="uaSave">💾 Save User</button><button class="uaBtn gray" id="uaCancel" style="display:none">Cancel Edit</button></div><div class="uaErr" id="uaFormErr"></div></div><div class="uaPanel"><h3 style="font-size:14px;margin-bottom:8px">Users</h3><div style="font-size:10px;color:#64748b;margin-bottom:8px">Selected features ke alawa user ko kuch bhi access nahi milega.</div><div id="uaList"></div></div></div></div>';document.body.appendChild(p);var l=document.createElement('div');l.id='uaLogin';l.innerHTML='<div class="uaLanding"><section class="uaHero"><div class="uaPill">⚡ ARORA TEXTILES · GEN-Z ERP</div><h1>Welcome to <span>Arora ERP</span></h1><p>One workspace for HR, payroll, attendance, employee records and compliance. Secure login ke baad aapko sirf wahi modules dikhेंगे jinka access admin ne diya hai.</p><div class="uaDots"><i></i><i></i><i></i></div></section><section class="uaLoginSide"><div class="uaCard"><div class="uaBrand"><div class="uaLogo">AT</div><div><b>Arora Textiles Pvt. Ltd.</b><span>SECURE ERP ACCESS</span></div></div><h2>Enter Login Credentials</h2><div class="uaSub">Use your assigned User ID and Password</div><div class="uaField"><label>USER ID</label><input id="uaLoginId" autocomplete="username" placeholder="Enter User ID"></div><div class="uaField"><label>PASSWORD</label><input id="uaLoginPass" type="password" autocomplete="current-password" placeholder="Enter Password"></div><button class="uaLoginBtn" id="uaLoginBtn">Login to ERP →</button><div class="uaErr" id="uaLoginErr"></div><div class="uaHint" id="uaBootHint"></div></div></section></div>';document.body.appendChild(l);document.getElementById('uaClose').onclick=closePage;document.getElementById('uaSave').onclick=saveUser;document.getElementById('uaCancel').onclick=clearForm;document.getElementById('uaAll').onclick=function(){Array.prototype.forEach.call(document.querySelectorAll('#uaChecks input'),function(c){c.checked=true})};document.getElementById('uaLoginBtn').onclick=doLogin;document.getElementById('uaLoginPass').onkeydown=function(ev){if(ev.key==='Enter')doLogin()};renderChecks();renderUsers();if(BOOT){var h=document.getElementById('uaBootHint');if(h)h.textContent='First setup: admin / admin123 — login ke baad password/user create kar sakte ho.'}}
          function renderChecks(){var h='';features().forEach(function(f){h+='<label class="uaCheck"><input type="checkbox" value="'+e(f.id)+'"> <span>'+e(f.name)+'</span></label>'});var box=document.getElementById('uaChecks');if(box)box.innerHTML=h}
          function clearForm(){editId=null;['uaName','uaId','uaPass'].forEach(function(id){var x=document.getElementById(id);if(x)x.value=''});Array.prototype.forEach.call(document.querySelectorAll('#uaChecks input'),function(c){c.checked=false});var t=document.getElementById('uaFormTitle'),c=document.getElementById('uaCancel'),id=document.getElementById('uaId');if(t)t.textContent='Create User';if(c)c.style.display='none';if(id){id.disabled=false;id.style.opacity='1'}document.getElementById('uaPass').placeholder='Password'}
          function saveUser(){var name=document.getElementById('uaName').value.trim(),id=document.getElementById('uaId').value.trim(),pass=document.getElementById('uaPass').value,err=document.getElementById('uaFormErr');var access=Array.prototype.filter.call(document.querySelectorAll('#uaChecks input'),function(c){return c.checked}).map(function(c){return c.value});if(!name||!id){err.textContent='Name aur User ID required hai.';return}var a=load(),idx=a.findIndex(function(u){return String(u.id).toLowerCase()===id.toLowerCase()});if(editId===null&&idx>=0){err.textContent='Ye User ID already exists.';return}if(editId===null&&!pass){err.textContent='Password required hai.';return}if(!access.length){err.textContent='Kam se kam 1 feature access select karo.';return}if(editId!==null){var old=a[editId];if(!old||old.admin){clearForm();return}old.name=name;old.access=access;if(pass)old.pass=pass}else a.push({id:id,name:name,pass:pass,admin:false,access:access});save(a);err.textContent='';clearForm();renderUsers();alert('User saved successfully. Access next login se exactly apply hoga.')}
          function renderUsers(){var a=load(),h='';a.forEach(function(u,i){h+='<div class="uaUser"><div class="uaUserInfo"><b>'+e(u.name||u.id)+'</b><span>ID: '+e(u.id)+' · '+(u.admin?'ADMIN · All Features':e((u.access||[]).join(', ')))+'</span></div><div class="uaActions">'+(!u.admin?'<button class="uaMini uaEdit" data-edit="'+i+'">Edit</button><button class="uaMini uaDel" data-del="'+i+'">Delete</button>':'')+'</div></div>'});var box=document.getElementById('uaList');if(!box)return;box.innerHTML=h||'<div style="padding:18px;text-align:center;color:#94a3b8;font-size:11px">No users found.</div>';Array.prototype.forEach.call(box.querySelectorAll('[data-edit]'),function(b){b.onclick=function(){editUser(+b.dataset.edit)}});Array.prototype.forEach.call(box.querySelectorAll('[data-del]'),function(b){b.onclick=function(){deleteUser(+b.dataset.del)}})}
          function editUser(i){var u=load()[i];if(!u||u.admin)return;editId=i;document.getElementById('uaName').value=u.name||'';document.getElementById('uaId').value=u.id;document.getElementById('uaId').disabled=true;document.getElementById('uaId').style.opacity='.7';document.getElementById('uaPass').value='';document.getElementById('uaPass').placeholder='Blank = keep old password';Array.prototype.forEach.call(document.querySelectorAll('#uaChecks input'),function(c){c.checked=(u.access||[]).indexOf(c.value)>=0});document.getElementById('uaFormTitle').textContent='Edit User Access';document.getElementById('uaCancel').style.display='inline-block'}
          function deleteUser(i){var a=load(),u=a[i];if(!u||u.admin)return;if(!confirm('Delete user '+u.id+'?'))return;a.splice(i,1);save(a);renderUsers()}
          function openPage(){var u=session();if(!u||!u.admin){alert('User Access sirf Admin ke liye hai.');return}renderChecks();renderUsers();document.getElementById('uaPage').style.display='block'}
          function closePage(){var p=document.getElementById('uaPage');if(p)p.style.display='none'}
          function doLogin(){var id=document.getElementById('uaLoginId').value.trim(),pass=document.getElementById('uaLoginPass').value,a=load(),u=a.find(function(x){return String(x.id).toLowerCase()===id.toLowerCase()&&x.pass===pass}),er=document.getElementById('uaLoginErr');if(!u){er.textContent='Wrong User ID or Password.';return}setSession(u);hideLogin();applyAccess();var p=firstAllowed(u);if(p&&typeof window.goPage==='function')window.goPage(p);else if(!u.admin)showLogin('Is user ko abhi koi valid feature access nahi diya gaya hai.')}
          function logout(){sessionStorage.removeItem(S);closePage();applyAccess();var i=document.getElementById('uaLoginId'),p=document.getElementById('uaLoginPass');if(i)i.value='';if(p)p.value='';showLogin('')}
          function guardGoPage(){if(window.__uaGuardV2||typeof window.goPage!=='function')return;var old=window.goPage;window.goPage=function(p){var u=session();if(!u){showLogin('Please login to continue.');return}if(!has(u,p)){alert('Is feature ka access aapke user ko nahi diya gaya hai.');return}var r=old.apply(this,arguments);applyAccess();return r};window.__uaGuardV2=1}
          function guardClicks(){document.addEventListener('click',function(ev){var x=ev.target&&ev.target.closest?ev.target.closest('.vitem[id^="vn-"]'):null;if(!x)return;var p=x.id.slice(3),u=session();if(p==='useraccess'){if(!u||!u.admin){ev.preventDefault();ev.stopPropagation();return}}else if(!has(u,p)){ev.preventDefault();ev.stopPropagation();if(u)alert('Is feature ka access aapke user ko nahi diya gaya hai.');else showLogin('Please login to continue.')}},true)}
          function init(){css();bootstrap();inject();guardGoPage();guardClicks();var u=session();if(!u){applyAccess();showLogin('')}else{hideLogin();applyAccess();var p=firstAllowed(u);if(p&&typeof window.goPage==='function')window.goPage(p)}}
          if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});else init();
          })();'''
          p.write_text(prefix + new + '\n', encoding='utf-8')
          PY
          node --check hr-workplace.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hr-workplace.js
          git commit -m "Add Gen-Z login landing and strict feature access"
          git push
