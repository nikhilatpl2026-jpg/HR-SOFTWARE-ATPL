name: Build LifePop APK

on:
  push:
    branches: [build-lifepop-apk-20260916]
    paths:
      - 'lifepop-build-v2/**'
      - '.github/workflows/build-lifepop.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reassemble final source
        run: |
          cat lifepop-build-v2/src.part00 lifepop-build-v2/src.part01 > /tmp/lifepop.tar.gz.b64
          base64 -d /tmp/lifepop.tar.gz.b64 > /tmp/lifepop.tar.gz
          echo '4f9d91e4d66cd21a8e01aa378291878822400c58e9407448ec503d353caec2f2  /tmp/lifepop.tar.gz' | sha256sum -c -
          tar -xzf /tmp/lifepop.tar.gz

      - name: Run LifePop logic tests
        working-directory: lifepop
        run: node test.cjs

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Android APK
        working-directory: lifepop
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify Android APK
        run: |
          mkdir -p out build-output
          cp lifepop/app/build/outputs/apk/debug/app-debug.apk out/LifePop_v1.0.apk
          unzip -t out/LifePop_v1.0.apk >/dev/null
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -1)
          test -n "$APKSIGNER" && test -x "$APKSIGNER"
          test -n "$AAPT" && test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs out/LifePop_v1.0.apk | tee out/SIGNATURE.txt
          "$AAPT" dump badging out/LifePop_v1.0.apk | grep "package: name='com.nikhil.lifepop'"
          if "$AAPT" dump permissions out/LifePop_v1.0.apk | grep -q 'android.permission.INTERNET'; then
            echo 'Unexpected INTERNET permission found' >&2
            exit 1
          fi
          sha256sum out/LifePop_v1.0.apk | tee out/SHA256.txt
          base64 -w 6000 out/LifePop_v1.0.apk > build-output/LifePop_v1.0.apk.b64
          cp out/SHA256.txt build-output/SHA256.txt
          cp out/SIGNATURE.txt build-output/SIGNATURE.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LifePop-v1.0-final
          path: out/

      - name: Publish final encoded build output to build branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-output/LifePop_v1.0.apk.b64 build-output/SHA256.txt build-output/SIGNATURE.txt
          git diff --cached --quiet && exit 0
          git commit -m 'build: publish final LifePop v1.0 APK output'
          git push
