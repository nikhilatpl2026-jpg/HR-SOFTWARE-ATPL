name: Apply shared Google auth V6
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-shared-google-auth-v6.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Append shared auth bridge
        shell: bash
        run: |
          python - <<'PY'
          import base64, pathlib
          p = pathlib.Path('hr-workplace.js')
          marker = 'Shared Google Apps Script auth bridge — V6 cross-browser'
          addon = base64.b64decode(' "> <SECRET>!=').decode('utf-8')
          text = p.read_text(encoding='utf-8')
          if marker not in text:
              p.write_text(text.rstrip() + '\n\n' + addon, encoding='utf-8')
          PY
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet -- hr-workplace.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr-workplace.js
          git commit -m 'Connect user access to shared Google Apps Script backend'
          git push
