name: Install HR ERP Data Assistant
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-hr-data-assistant.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install only tiny lazy AI loader
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          m = re.search(r'<script src="hr-workplace\.js[^"]*"></script>', text)
          if not m:
              raise SystemExit('Expected hr-workplace.js loader not found; refusing to modify index.html')
          anchor = m.group(0)

          # Remove ONLY AI assistant loaders from startup. Keep every normal ERP module untouched.
          patterns = [
              r'\n<script src="hr-data-assistant(?:-payload-[1-5])?\.js\?v=[^"]+"></script>',
              r'\n<script src="hr-data-assistant-pro(?:-payload-[1-6])?\.js\?v=[^"]+"></script>',
              r'\n<script src="hr-data-assistant-v3(?:-payload)?\.js\?v=[^"]+"></script>',
              r'\n<script src="hr-ai-llm-v4(?:-payload)?\.js\?v=[^"]+"></script>',
              r'\n<script src="hr-ai-llm-v5\.js\?v=[^"]+"></script>',
              r'\n<script src="hr-ai-unified-v6\.js\?v=[^"]+"></script>',
              r'\n<script src="hr-ai-lazy-loader\.js\?v=[^"]+"></script>',
          ]
          for pat in patterns:
              text = re.sub(pat, '', text)

          lazy = '<script src="hr-ai-lazy-loader.js?v=20260912-1"></script>'
          text = text.replace(anchor, anchor + '\n' + lazy, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify lazy AI syntax and scoped change
        shell: bash
        run: |
          node --check hr-ai-lazy-loader.js
          node --check hr-ai-unified-v6.js
          git diff --check
          git diff -- index.html
          python - <<'PY'
          from pathlib import Path
          import re
          t = Path('index.html').read_text(encoding='utf-8')
          ai = re.findall(r'<script src="(hr-(?:data-assistant|ai-)[^"]+)"', t)
          if ai != ['hr-ai-lazy-loader.js?v=20260912-1']:
              raise SystemExit('Unexpected AI startup loaders: '+repr(ai))
          if 'hr-workplace.js?v=20260911-loader-fix1' not in t:
              raise SystemExit('hr-workplace version changed unexpectedly')
          print('Startup AI loader OK:', ai)
          PY
      - name: Commit loader-only index change if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use lazy HR ERP AI V6 loader for fast login'
          git push
