name: Install HR ERP Data Assistant
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-hr-data-assistant.yml'
permissions:
  contents: write
jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add isolated HR Data Assistant loaders
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          m = re.search(r'<script src="hr-workplace\.js[^"]*"></script>', text)
          if not m:
              raise SystemExit('Expected hr-workplace.js loader not found; refusing to modify index.html')
          anchor = m.group(0)
          tags = [
              '<script src="hr-data-assistant-payload-1.js?v=20260911-2"></script>',
              '<script src="hr-data-assistant-payload-2.js?v=20260911-2"></script>',
              '<script src="hr-data-assistant-payload-3.js?v=20260911-2"></script>',
              '<script src="hr-data-assistant-payload-4.js?v=20260911-2"></script>',
              '<script src="hr-data-assistant-payload-5.js?v=20260911-2"></script>',
              '<script src="hr-data-assistant.js?v=20260911-2"></script>',
              '<script src="hr-data-assistant-pro-payload-1.js?v=20260911-3"></script>',
              '<script src="hr-data-assistant-pro-payload-2.js?v=20260911-3"></script>',
              '<script src="hr-data-assistant-pro-payload-3.js?v=20260911-3"></script>',
              '<script src="hr-data-assistant-pro-payload-4.js?v=20260911-3"></script>',
              '<script src="hr-data-assistant-pro-payload-5.js?v=20260911-3"></script>',
              '<script src="hr-data-assistant-pro-payload-6.js?v=20260911-3"></script>',
              '<script src="hr-data-assistant-pro.js?v=20260911-3"></script>',
              '<script src="hr-data-assistant-v3-payload.js?v=20260911-4"></script>',
              '<script src="hr-data-assistant-v3.js?v=20260911-4"></script>',
          ]
          # Clean only prior AI-assistant loader tags; preserve every pre-existing ERP loader/module.
          text = re.sub(r'\n<script src="hr-data-assistant(?:-payload-[1-5])?\.js\?v=[^"]+"></script>', '', text)
          text = re.sub(r'\n<script src="hr-data-assistant-pro(?:-payload-[1-6])?\.js\?v=[^"]+"></script>', '', text)
          text = re.sub(r'\n<script src="hr-data-assistant-v3(?:-payload)?\.js\?v=[^"]+"></script>', '', text)
          block = '\n'.join(tags)
          text = text.replace(anchor, anchor + '\n' + block, 1)
          p.write_text(text, encoding='utf-8')
          PY
      - name: Verify assistant syntax and scoped change
        shell: bash
        run: |
          node --check hr-data-assistant-payload-1.js
          node --check hr-data-assistant-payload-2.js
          node --check hr-data-assistant-payload-3.js
          node --check hr-data-assistant-payload-4.js
          node --check hr-data-assistant-payload-5.js
          node --check hr-data-assistant.js
          node --check hr-data-assistant-pro-payload-1.js
          node --check hr-data-assistant-pro-payload-2.js
          node --check hr-data-assistant-pro-payload-3.js
          node --check hr-data-assistant-pro-payload-4.js
          node --check hr-data-assistant-pro-payload-5.js
          node --check hr-data-assistant-pro-payload-6.js
          node --check hr-data-assistant-pro.js
          node --check hr-data-assistant-v3-payload.js
          node --check hr-data-assistant-v3.js
          git diff --check
          git diff -- index.html
      - name: Commit loader only if needed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Load HR ERP Data Assistant V3'
          git push
