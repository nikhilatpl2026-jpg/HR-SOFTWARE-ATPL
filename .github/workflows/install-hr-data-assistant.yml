name: Fix HR ERP AI V8 Accuracy Final
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-hr-data-assistant.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply V8 accuracy patch
        run: python .github/scripts/patch_v8_accuracy.py
      - name: Verify V8 runtime
        shell: bash
        run: |
          node --check hr-ai-lazy-loader.js
          node --check hr-ai-fast-v8.js
          node --check hr-ai-fast-v8-p1.js
          node --check hr-ai-fast-v8-p2.js
          node --check hr-ai-fast-v8-p3.js
          node --check hr-ai-fast-v8-p4a.js
          node --check hr-ai-fast-v8-p4b.js
          python - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          b=''
          for p in ['p1','p2','p3','p4a','p4b']:
              s=Path(f'hr-ai-fast-v8-{p}.js').read_text()
              m=re.search(r"\+'([^']*)'",s)
              if not m: raise SystemExit('missing '+p)
              b+=m.group(1)
          js=gzip.decompress(base64.b64decode(b)).decode()
          Path('/tmp/v8-fixed.js').write_text(js)
          for x in ['resolveEntity','strictRows','PF deduction','n>100000','Never answer using data from a different employee']:
              if x not in js: raise SystemExit('guard missing '+x)
          idx=Path('index.html').read_text()
          if 'hr-ai-lazy-loader.js?v=20260912-9' not in idx: raise SystemExit('new lazy loader not installed')
          if 'hr-workplace.js?v=20260911-loader-fix1' not in idx: raise SystemExit('core loader changed')
          print('V8 accuracy guards verified')
          PY
          node --check /tmp/v8-fixed.js
          git diff --check
      - name: Commit scoped fix
        shell: bash
        run: |
          if git diff --quiet -- hr-ai-fast-v8-p1.js hr-ai-fast-v8-p2.js hr-ai-fast-v8-p3.js hr-ai-fast-v8-p4a.js hr-ai-fast-v8-p4b.js hr-ai-lazy-loader.js index.html; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr-ai-fast-v8-p1.js hr-ai-fast-v8-p2.js hr-ai-fast-v8-p3.js hr-ai-fast-v8-p4a.js hr-ai-fast-v8-p4b.js hr-ai-lazy-loader.js index.html
          git commit -m 'Fix V8 exact employee month and PF deduction accuracy'
          git push
