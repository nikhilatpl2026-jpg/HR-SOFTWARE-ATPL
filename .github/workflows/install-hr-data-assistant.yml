name: Inspect HR ERP AI V8 Logic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-hr-data-assistant.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and inspect V8 answer logic
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,base64,gzip
          parts=['p1','p2','p3','p4a','p4b']
          chunks=[]
          for part in parts:
              s=Path(f'hr-ai-fast-v8-{part}.js').read_text(encoding='utf-8')
              m=re.search(r"\+'([^']+)'",s)
              if not m: raise SystemExit(f'chunk missing {part}')
              chunks.append(m.group(1))
          inner=gzip.decompress(base64.b64decode(''.join(chunks))).decode('utf-8')
          Path('/tmp/v8.js').write_text(inner,encoding='utf-8')
          print('--- FUNCTION NAMES ---')
          for m in re.finditer(r'function\s+([A-Za-z0-9_$]+)\s*\(',inner):
              print(m.group(1))
          print('--- PF / EMPLOYEE / ANSWER SNIPPETS ---')
          lines=inner.splitlines()
          for i,line in enumerate(lines):
              low=line.lower()
              if any(k in low for k in ['pf','employee','answerone','answerfield','fieldvalue','extractfield','strict','entity']):
                  a=max(0,i-2); b=min(len(lines),i+3)
                  print(f'### lines {a+1}-{b}')
                  for j in range(a,b): print(lines[j])
          PY
          node --check /tmp/v8.js
