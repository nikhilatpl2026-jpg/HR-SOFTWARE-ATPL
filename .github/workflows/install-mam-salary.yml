name: Install Mam salary module

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-mam-salary.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Load Mam salary module safely
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hr-workplace.js')
          s=p.read_text(encoding='utf-8')
          marker='mam-salary.js?v=20260910a'
          if marker not in s:
              loader="\n\n/* Mam Sheet to Compliance Salary loader */\n(function(){var s=document.createElement('script');s.src='mam-salary.js?v=20260910a';s.async=false;document.head.appendChild(s)})();\n"
              p.write_text(s.rstrip()+loader,encoding='utf-8')
          PY
          node --check hr-workplace.js
          node --check mam-salary.js
      - name: Commit loader and remove temporary workflow
        run: |
          rm -f .github/workflows/install-mam-salary.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Enable Mam sheet compliance salary generator"
          git push origin main
