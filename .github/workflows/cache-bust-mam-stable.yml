name: Force stable Mam Salary cache version

on:
  push:
    paths:
      - .github/workflows/cache-bust-mam-stable.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Mam Salary loader version safely
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('hr-workplace.js')
          text=p.read_text(encoding='utf-8')
          new,n=re.subn(r"mam-salary\.js\?v=[A-Za-z0-9._-]+","mam-salary.js?v=20260911-stable2",text)
          if n < 1:
              raise SystemExit('Mam Salary loader reference not found')
          p.write_text(new,encoding='utf-8')
          print('patched references:',n)
          PY
          node --check hr-workplace.js
      - name: Commit cache-bust
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hr-workplace.js
          git diff --cached --quiet && exit 0
          git commit -m "Force stable Mam Salary cache version"
          git push origin main
