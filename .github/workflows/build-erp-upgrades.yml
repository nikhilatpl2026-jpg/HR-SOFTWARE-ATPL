name: Build plain ERP upgrade bundle

on:
  push:
    paths:
      - erp-upgrades.js.gz.b64
      - .github/workflows/build-erp-upgrades.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Decode upgrade bundle
        shell: bash
        run: |
          set -euo pipefail
          tr -d '\r\n\t ' < erp-upgrades.js.gz.b64 | base64 --decode | gzip -dc > erp-upgrades.js
          node --check erp-upgrades.js
          test -s erp-upgrades.js
      - name: Commit plain JavaScript bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add erp-upgrades.js
          git diff --cached --quiet && exit 0
          git commit -m "Build plain ERP upgrade bundle"
          git push origin main
