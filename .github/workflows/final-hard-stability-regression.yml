name: Final Hard Stability Regression
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run stability regression
        run: node --test tests/final-hard-stability-regression.test.js tests/shared-cross-device-final.test.js tests/ui-control-data-safety-audit.test.js
      - name: Install browser smoke dependency
        run: npm install --no-save puppeteer-core@24
      - name: Run browser runtime smoke
        run: |
          python3 -m http.server 4173 >/tmp/atpl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          node tests/browser-runtime-smoke.js
