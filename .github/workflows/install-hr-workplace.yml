name: Install HR Workplace
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  install:
    if: ${{ !contains(github.event.head_commit.message, 'Install HR Workplace') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add module to app
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="hr-workplace.js"></script>'
          if tag not in s:
              if '</body>' in s:
                  s=s.replace('</body>',tag+'\n</body>',1)
              else:
                  s += '\n'+tag
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html hr-workplace.js .github/workflows/install-hr-workplace.yml
          git diff --cached --quiet || git commit -m 'Install HR Workplace'
          git push
