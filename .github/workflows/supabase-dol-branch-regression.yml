name: Supabase DOL Branch Regression
on:
  push:
    branches: [ supabase-dol-single-authority ]
  workflow_dispatch:

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run all repository tests
        run: node --test tests/*.test.js
      - name: Install browser smoke dependency
        run: npm install --no-save puppeteer-core@24
      - name: Run browser runtime smoke
        run: |
          python3 -m http.server 4173 >/tmp/atpl-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID' EXIT
          sleep 1
          node tests/browser-runtime-smoke.js

  edge-auth-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirm browser CORS allows x-atpl-token
        shell: bash
        run: |
          set -euo pipefail
          URL='https://gsbyzddibdjxekutpkip.supabase.co/functions/v1/dol-api'
          headers="$(mktemp)"
          code="$(curl -sS -D "$headers" -o /dev/null -w '%{http_code}' --connect-timeout 10 --max-time 25 \
            -X OPTIONS "$URL" \
            -H 'Origin: https://nikhilatpl2026-jpg.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: x-atpl-token,apikey,authorization,content-type')"
          cat "$headers"
          case "$code" in 200|204) ;; *) echo "Preflight failed: HTTP $code" >&2; exit 1;; esac
          allow_headers="$(grep -i '^access-control-allow-headers:' "$headers" | tr '[:upper:]' '[:lower:]' || true)"
          allow_origin="$(grep -i '^access-control-allow-origin:' "$headers" | tr '[:upper:]' '[:lower:]' || true)"
          printf '%s' "$allow_headers" | grep -Fq 'x-atpl-token' || { echo 'CORS does not allow x-atpl-token' >&2; exit 1; }
          [ -n "$allow_origin" ] || { echo 'CORS allow-origin header missing' >&2; exit 1; }

      - name: Confirm dol-api refuses requests without ERP token
        shell: bash
        run: |
          set -euo pipefail
          URL='https://gsbyzddibdjxekutpkip.supabase.co/functions/v1/dol-api'
          KEY='sb_publishable_iBXc8wO99laFLO7-Pcv-Dw_BbpPJpII'
          body="$(mktemp)"
          code="$(curl -sS -o "$body" -w '%{http_code}' --connect-timeout 10 --max-time 25 \
            -X POST "$URL" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            -H 'Content-Type: application/json' \
            --data '{"action":"list","type":"pf"}')"
          cat "$body"
          if [ "$code" = "200" ]; then
            echo 'dol-api accepted a request with no x-atpl-token' >&2
            exit 1
          fi
          case "$code" in
            400|401|403) exit 0 ;;
            *) echo "Unexpected dol-api status: $code" >&2; exit 1 ;;
          esac
