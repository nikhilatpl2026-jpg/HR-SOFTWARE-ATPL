name: Bust permanent data loader cache
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bust-permanent-data-loader.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Load permanent data guard bootstrap
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('hr-workplace.js')
          text=p.read_text(encoding='utf-8')
          old='mam-salary.js?v=20260917-sharedfix1'
          new='mam-salary.js?v=20260917-permanent1'
          if old not in text and new not in text:
              raise SystemExit('Mam loader marker not found')
          text=text.replace(old,new)
          p.write_text(text,encoding='utf-8')
          PY
          node --check hr-workplace.js
          node --check mam-salary.js
          node --check erp-persistence-guard-v1.js
      - name: Commit cache bust
        shell: bash
        run: |
          if git diff --quiet -- hr-workplace.js; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add hr-workplace.js
          git commit -m 'Load permanent shared-data guard'
          git push
